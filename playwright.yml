tests-browserstack:
    name: BrowserStack - Playwright cloud run
    runs-on: ubuntu-latest
    needs: tests-local   # remove this line if you don't want to wait for local job

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
     # BASE_URL: ${{ secrets.BASE_URL }}
      # Set to 'true' only if testing internal/staging via BS Local
     #  BROWSERSTACK_LOCAL: ${{ secrets.BROWSERSTACK_LOCAL }}
     #  BROWSERSTACK_LOCAL_IDENTIFIER: ${{ secrets.BROWSERSTACK_LOCAL_IDENTIFIER }}
     # BUILD_TAG: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ensure local Playwright client is installed (required for BS compatibility)
      - name: Install Playwright (client only)
        run: npx playwright install

      # Start BrowserStack Local if requested
      - name: Start BrowserStack Local (daemon)
        if: env.BROWSERSTACK_LOCAL == 'true'
        run: npx browserstack-local --daemon start --key "$BROWSERSTACK_ACCESS_KEY" ${BROWSERSTACK_LOCAL_IDENTIFIER && format('--local-identifier "{0}"', env.BROWSERSTACK_LOCAL_IDENTIFIER)}

      # Run specific BrowserStack projects (edit list to your projects)
      - name: Run tests on BrowserStack
        run: |
          set -e
          echo "Running BS projects…"
          npx playwright test \
            --project "BS - Chrome@Win11" \
            --project "BS - Safari@Ventura" \
            --project "BS - iPhone 15 Pro (iOS)" \
            --project "BS - Pixel 8 (Android)"

      # Stop BrowserStack Local
      - name: Stop BrowserStack Local (daemon)
        if: always() && env.BROWSERSTACK_LOCAL == 'false'
        run: npx browserstack-local --daemon stop --key "$BROWSERSTACK_ACCESS_KEY"

      # Upload local HTML report (BS also has its own dashboard)
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bs
          path: playwright-report
          if-no-files-found: ignore